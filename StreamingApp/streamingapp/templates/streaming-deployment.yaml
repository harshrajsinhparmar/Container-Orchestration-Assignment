apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-streaming
  labels:
    app: streaming
spec:
  replicas: {{ .Values.services.streaming.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
        - name: streaming
          image: "{{ .Values.services.streaming.image.repository }}:{{ .Values.services.streaming.image.tag }}"
          imagePullPolicy: {{ .Values.services.streaming.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.streaming.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          env:
            - name: PORT
              value: {{ .Values.services.streaming.port | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-svc
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.streaming.port }}
      targetPort: {{ .Values.services.streaming.port }}
  selector:
    app: streaming
